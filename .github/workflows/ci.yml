name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer cs

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer analyse

  test-unit:
    name: Unit Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          extensions: zlib, mbstring
      - run: composer install --no-interaction --prefer-dist
      - run: composer test:unit

  test-integration:
    name: Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: zlib, mbstring
          ini-values: memory_limit=512M
      - run: composer install --no-interaction --prefer-dist
      - run: git config --global user.email "ci@pitmaster.dev"
      - run: git config --global user.name "CI"
      - run: git config --global init.defaultBranch main
      - run: composer test:integration

  test-oracle:
    name: Oracle Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: zlib, mbstring
          ini-values: memory_limit=512M
      - run: composer install --no-interaction --prefer-dist
      - run: git config --global user.email "ci@pitmaster.dev"
      - run: git config --global user.name "CI"
      - run: git config --global init.defaultBranch main
      - run: PITMASTER_TEST_JOBS=4 composer test:oracle

  oracle-smoke:
    name: Oracle Smoke (${{ matrix.scenario }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - repository/init-basic
          - refs/lightweight-tag-create
          - status/status-porcelain-v2
          - protocol/v1-upload-pack
          - merge/merge-conflict-continue
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: zlib, mbstring
          ini-values: memory_limit=512M
      - run: composer install --no-interaction --prefer-dist
      - run: git config --global user.email "ci@pitmaster.dev"
      - run: git config --global user.name "CI"
      - run: git config --global init.defaultBranch main
      - run: ./bin/test-scenario ${{ matrix.scenario }}

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs

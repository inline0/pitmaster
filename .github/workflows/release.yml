name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: shivammathur/setup-php@728c6c6b8cf02c2e48117716a91ee48313958a19
        with:
          php-version: '8.4'
          tools: composer

      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify autoloader
        run: |
          php -r "require 'vendor/autoload.php'; new Pitmaster\Pitmaster(); echo 'Autoloader OK';"

      - name: Create release archive
        run: |
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' \
            --exclude='tests' --exclude='scenarios' --exclude='fixtures' \
            --exclude='config' --exclude='CLAUDE.md' --exclude='SUPPORT_MATRIX.md' \
            --exclude='phpunit.xml*' --exclude='phpcs.xml' --exclude='phpstan.neon*' \
            --exclude='.phpunit*' --exclude='.phpstan' \
            --exclude='bin/oracle' --exclude='bin/actual' --exclude='bin/compare' \
            --exclude='bin/test-scenario' --exclude='bin/test-regression' \
            --exclude='bin/verify-compliance' --exclude='bin/support-matrix' \
            --exclude='bin/acquire-*' \
            . dist/pitmaster/
          cd dist && zip -r ../pitmaster.zip pitmaster/

      - name: Upload release asset
        run: gh release upload "${{ github.event.release.tag_name }}" pitmaster.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
